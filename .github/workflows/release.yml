name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Build & publish agentgate
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m build
          if [ -n "$TWINE_PASSWORD" ]; then python -m twine upload dist/*; else echo "PYPI_TOKEN not set — skip upload"; fi
      - name: Build & publish mcp-sp
        working-directory: mcp-sp
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m build
          if [ -n "$TWINE_PASSWORD" ]; then python -m twine upload dist/*; else echo "skip mcp-sp upload"; fi
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            mcp-sp/dist/*
