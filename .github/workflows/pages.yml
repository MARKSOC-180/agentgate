name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site
          cp web/start.html _site/index.html
          cp web/start.html _site/start.html
          cp web/buy.html _site/buy.html
          cp web/danger.html _site/danger.html
          cp web/audit.html _site/audit.html
          cp web/compare.html _site/compare.html
          cp web/delivery-preview.html _site/delivery-preview.html
          cp web/easy.html _site/easy.html
          mkdir -p _site/youxing
          cp web/youxing.html _site/youxing.html
          cp web/youxing/index.html _site/youxing/index.html
          cp web/youxing/app.css _site/youxing/app.css
          cp web/youxing/app.js _site/youxing/app.js
          mkdir -p _site/packs/vendor_security_unblock
          cp packs/vendor_security_unblock/*.md _site/packs/vendor_security_unblock/ 2>/dev/null || true
          cp -r assets _site/assets 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
